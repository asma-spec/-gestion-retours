<div class="container mt-4">
  <h2>Ajouter un Historique</h2>

  <div *ngIf="message" class="alert alert-success">{{ message }}</div>
  <div *ngIf="erreur" class="alert alert-danger">{{ erreur }}</div>

  <form (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Retour concerné</label>
      <select class="form-control"
              [(ngModel)]="historique.retourId" name="retourId" required>
        <option [value]="0">-- Choisir un retour --</option>
        <option *ngFor="let r of retours" [value]="r.id">
          #{{ r.id }} - {{ r.produit }} ({{ r.client }})
        </option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Action</label>
      <select class="form-control"
              [(ngModel)]="historique.action" name="action" required>
        <option value="Validé">Validé</option>
        <option value="Rejeté">Rejeté</option>
        <option value="En cours">En cours</option>
        <option value="Retourné en stock">Retourné en stock</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Employé</label>
      <input type="text" class="form-control"
             [(ngModel)]="historique.employe" name="employe" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Date</label>
      <input type="date" class="form-control"
             [(ngModel)]="historique.date" name="date" required>
    </div>

    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a routerLink="/historiques" class="btn btn-secondary ms-2">Annuler</a>
  </form>
</div>
