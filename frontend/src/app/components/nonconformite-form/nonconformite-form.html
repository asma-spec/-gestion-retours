<div class="container mt-4">
  <h2>Ajouter une Non-Conformité</h2>

  <div *ngIf="message" class="alert alert-success">{{ message }}</div>
  <div *ngIf="erreur" class="alert alert-danger">{{ erreur }}</div>

  <form (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control"
                [(ngModel)]="nc.description" name="description" required></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Gravité</label>
      <select class="form-control"
              [(ngModel)]="nc.gravite" name="gravite" required>
        <option value="faible">Faible</option>
        <option value="moyenne">Moyenne</option>
        <option value="élevée">Élevée</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Date</label>
      <input type="date" class="form-control"
             [(ngModel)]="nc.date" name="date" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Produit</label>
      <input type="text" class="form-control"
             [(ngModel)]="nc.produit" name="produit" required>
    </div>

    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a routerLink="/nonconformites" class="btn btn-secondary ms-2">Annuler</a>
  </form>
</div>
