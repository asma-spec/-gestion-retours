<div class="container mt-4">
  <h2>Gestion du Stock</h2>

  <div class="card mb-4 bg-info text-white">
    <div class="card-body">
      <h5 class="card-title">Stock total retourné</h5>
      <h2>{{ stockTotal }} produit(s)</h2>
    </div>
  </div>

  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Produit</th>
        <th>Client</th>
        <th>État</th>
        <th>Quantité en stock</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of retours">
        <td>{{ r.id }}</td>
        <td>{{ r.produit }}</td>
        <td>{{ r.client }}</td>
        <td>
          <span class="badge bg-info">{{ r.etatTraitement }}</span>
        </td>
        <td>
          <span class="badge bg-success">{{ r.quantiteStock }}</span>
        </td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="retours.length === 0">Aucun produit en stock pour le moment.</p>
</div>
